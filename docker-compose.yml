version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logistics_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: enterprise_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: logistics_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:6-jammy
    container_name: logistics_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: SecretMongoPass123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
