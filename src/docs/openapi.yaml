openapi: 3.0.3
info:
  title: My Logistics API
  version: 1.0.0
  description: Modular logistics API with tenant-scoped order management and optimistic locking.
servers:
  - url: http://localhost:5000/api/v1
paths:
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation failed
  /auth/login:
    post:
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated
        '401':
          description: Invalid credentials
  /orders:
    post:
      summary: Create an order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
    get:
      summary: List tenant orders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ASSIGNED, IN_TRANSIT, COMPLETED, CANCELLED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated order list
  /orders/{id}/assign:
    patch:
      summary: Assign or reassign an order
      description: Requires the version currently held by the dispatcher. A stale version returns 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverRequest'
      responses:
        '200':
          description: Order assigned
        '409':
          description: Version conflict or invalid order state
  /tracking/live/{driverId}:
    get:
      summary: Get a driver's latest live location
      security: [{ bearerAuth: [] }]
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest location from Redis
        '404':
          description: No active location is available
  /tracking/history/{orderId}:
    get:
      summary: Get an order's historical route
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered location history from MongoDB
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [tenantName, email, password, firstName, lastName]
      properties:
        tenantName:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CreateOrderRequest:
      type: object
      required: [customerId, pickupAddress, dropoffAddress]
      properties:
        customerId:
          type: string
          format: uuid
        pickupAddress:
          type: string
        dropoffAddress:
          type: string
    AssignDriverRequest:
      type: object
      required: [driverId, currentVersion]
      properties:
        driverId:
          type: string
          format: uuid
        currentVersion:
          type: integer
          minimum: 1
